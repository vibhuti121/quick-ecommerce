server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: catalog-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Product-image uploads; default 1MB is too small for real photos.
      max-file-size: 8MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Head sampling ratio. Dev/pilot defaults to 1.0 (every journey captured for the trace
      # demo); set TRACING_SAMPLE_PROBABILITY lower in prod. Always-sample on error/payment/order
      # is a sampler refinement (deferred) layered on top of this ratio.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      # Elastic APM Server OTLP/HTTP intake on the compose network; Kibana APM renders the waterfall.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://apm-server:8200/v1/traces}

# Redis-backed read cache TTLs (seconds). Single products are stable → long TTL;
# browse pages shift as inventory/products change → shorter TTL.
app:
  cache:
    product-ttl-seconds: ${CACHE_PRODUCT_TTL:3600}
    browse-ttl-seconds: ${CACHE_BROWSE_TTL:600}
  # OpenSearch product search (secondary index; Postgres stays source of truth). enabled=false leaves
  # the client bean absent and the search endpoint degrades to a Postgres ILIKE fallback. Short timeouts
  # so a dead/slow OpenSearch fails fast into that fallback instead of stalling a request thread.
  search:
    enabled: ${SEARCH_ENABLED:true}
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
    scheme: ${OPENSEARCH_SCHEME:http}
    index: ${OPENSEARCH_INDEX:products}
    connect-timeout-ms: ${OPENSEARCH_CONNECT_TIMEOUT_MS:2000}
    response-timeout-ms: ${OPENSEARCH_RESPONSE_TIMEOUT_MS:2000}
    backfill:
      # How long startup waits for OpenSearch before skipping backfill (it boots a bit behind catalog).
      readiness-timeout-ms: ${SEARCH_BACKFILL_READINESS_TIMEOUT_MS:30000}
  # Hybrid product recommendations. catalog-service blends co-purchase (fetched from order-service,
  # which owns the purchase history) with content-based similarity (OpenSearch more_like_this), and
  # falls back to same-category browse. The order-service call is BEST-EFFORT: short timeouts so a
  # slow/down order-service fails fast and the endpoint degrades instead of 503-ing. enabled=false
  # skips the co-purchase call entirely (content-based + category only).
  recommendations:
    enabled: ${REC_ENABLED:true}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8094}
    size-default: ${REC_SIZE_DEFAULT:8}
    connect-timeout-ms: ${REC_CONNECT_TIMEOUT_MS:1500}
    response-timeout-ms: ${REC_RESPONSE_TIMEOUT_MS:2000}
  # S3-compatible object storage (MinIO) for product images.
  #  endpoint   — in-network S3 API the service uploads to (path-style).
  #  public-url — browser-facing base used to BUILD image URLs; differs from endpoint because the
  #               storefront runs on the host (localhost) while the service talks to it as `minio`.
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    # No defaults: object-storage credentials must come from env (.env in dev — gen-secrets.sh).
    # A missing value fails startup rather than shipping the well-known minioadmin/minioadmin pair.
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:product-images}
    region: ${MINIO_REGION:us-east-1}
