# Admin console server. Everything is behind HTTP basic-auth (auth_basic at server scope is inherited
# by all locations, including the API proxy). The htpasswd file is generated at container start from
# the ADMIN_USER / ADMIN_PASSWORD env vars (see 40-htpasswd.sh) — no credential is baked into the image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "MaLLADE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Don't let the admin console be indexed even if it were ever reachable.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;

    # Reverse-proxy the admin API to order-service on the docker network, injecting the ADMIN role.
    # order-service publishes no host port, so this is the only way in — and it's loopback + basic-auth
    # gated. proxy_pass has no URI part, so the original /admin/orders... path is forwarded unchanged.
    location /admin/orders {
        proxy_pass http://order-service:8094;
        proxy_set_header X-User-Role ADMIN;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # order-service authorizes via the injected X-User-Role (AdminRoleFilter), not the token, so
        # strip the console's Basic creds rather than forward them. auth_basic above already gated this.
        proxy_set_header Authorization "";
    }

    # Reverse-proxy /api/* and /auth/* to the gateway over TLS, terminated server-side here so the
    # browser only ever speaks plain HTTP to its own loopback origin — this kills BOTH the self-signed
    # cert prompt and any CORS preflight. proxy_ssl_verify is off because the gateway's dev cert is
    # self-signed; the hop is container→container on the compose network, not over the public internet.
    # The bearer token the SPA sends in Authorization is forwarded as-is for the gateway's AuthFilter.
    # NOTE: the browser sends Origin: http://localhost:5174 on every POST (e.g. /auth/login). From the
    # browser this is a SAME-ORIGIN call (page and API share the 5174 loopback origin), but the gateway's
    # globalcors only allows the storefront origin (ALLOWED_ORIGIN, default :5173) and would 403 the
    # forwarded Origin before the route runs. The admin->gateway hop is server-side (nginx->gateway), not
    # a browser cross-origin request, so we clear Origin here: the gateway then sees a non-CORS request
    # and passes it through. This does NOT relax the gateway's CORS for real cross-origin callers — they
    # don't traverse this proxy (loopback + basic-auth gated).
    # The SPA carries its JWT in X-Access-Token, NOT Authorization — because the browser uses
    # Authorization for THIS console's Basic credentials (auth_basic above), and a Bearer there would
    # clobber them and make auth_basic 401 every XHR. So here we rebuild Authorization: Bearer <jwt>
    # for the gateway's AuthFilter from X-Access-Token, and clear it when absent so an anonymous call
    # doesn't leak the Basic creds upstream. (set-inside-if is the documented-safe use of `if`.)
    location /api/ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin "";
        set $fwd_auth "";
        if ($http_x_access_token) { set $fwd_auth "Bearer $http_x_access_token"; }
        proxy_set_header Authorization $fwd_auth;
    }

    location /auth/ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin "";
        # Login carries no token; clear the console's Basic creds so they're not forwarded to the
        # gateway. (Same X-Access-Token rebuild as /api/, for any future token-bearing /auth/* call.)
        set $fwd_auth "";
        if ($http_x_access_token) { set $fwd_auth "Bearer $http_x_access_token"; }
        proxy_set_header Authorization $fwd_auth;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
