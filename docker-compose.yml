# Full local stack for quick-ecommerce — one `docker compose up` brings up the edge (gateway + auth),
# all five commerce services, and their backing stores. Each service owns its own Postgres database;
# cart lives in Redis. Data persists in named volumes, so the whole journey survives a restart.
#
# Edge entrypoint: https://localhost:8443 (gateway, TLS-terminated — Pillar 4). It uses a dev
# self-signed cert, so clients need -k/--insecure. Everything else is reachable through it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for product images (Phase 2, Pillar 4). Two ports:
  #  - 9000 the S3 API (catalog-service uploads here, in-network as http://minio:9000)
  #  - 9001 the web console (http://localhost:9001, same root creds)
  # No healthcheck binary ships in the server image, so dependents use service_started and
  # catalog-service retries bucket bootstrap on startup.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?missing - run ./scripts/gen-secrets.sh to create .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # Search index for the catalog (Phase 2, search pillar). OpenSearch is the OSS (Apache-2.0) fork of
  # Elasticsearch — fits the fully-local, asset-light pilot. Postgres stays the source of truth; this is
  # a secondary index kept consistent by catalog-service (dual-write on writes + startup backfill of the
  # Flyway-seeded rows). Single-node, security plugin OFF for local dev (a real deploy enables it + TLS +
  # creds — see README). 512m heap keeps it light. memlock unlimited so the JVM can lock its heap.
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # 2.12+ requires a strong admin password even with security off; 2.11.1 does not. Pin 2.11.1.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: postgres
      DB_NAME: authdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      # HS256 requires a key >= 256 bits (32 bytes); a shorter secret makes jjwt throw WeakKeyException.
      # No default on purpose: a signing key in source = anyone can forge tokens. Generated into .env.
      JWT_SECRET: ${JWT_SECRET:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Google OAuth2 is optional for local dev (guest tokens cover the journey). Real values enable
      # Google login; dummies let the service boot — the discovery URL itself is public.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # RBAC admin allowlist (Phase 3, Pillar 1). Comma-separated emails; empty → no admins.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Phone-OTP store (otp:{phone} hashed code + attempts + resend throttle, short TTLs). Same Redis
      # the rest of the stack uses. Password login needs no Redis; only the OTP method touches it.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # DEV STUB: echo the OTP in the request response so local/CI can verify without a real SMS.
      # MUST be false (or unset) in any real deployment — it would leak every code. Real SMS at go-live.
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build: ./catalog-service
    environment:
      DB_HOST: postgres
      DB_NAME: catalogdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Read-through cache for the catalog browse/detail path. A Redis outage degrades to DB reads.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Object storage for product images. ENDPOINT is the in-network S3 API the service uploads to;
      # PUBLIC_URL is what the browser uses to fetch the image, so it must be the host-published address.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?missing - run ./scripts/gen-secrets.sh to create .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
      # Secondary search index. Postgres remains source of truth; an OpenSearch outage degrades search
      # to a Postgres ILIKE fallback and never fails a catalog write (graceful degradation).
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_SCHEME: http
      # Co-purchase signal for hybrid recommendations. catalog calls order-service directly over the
      # docker network (bypassing the gateway), BEST-EFFORT: a slow/down order-service fails fast on a
      # short timeout and recs degrade to content-based/category — hence NO depends_on (a boot-order
      # coupling would defeat the degradation contract).
      ORDER_SERVICE_URL: http://order-service:8094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      # service_started (not _healthy) like minio: catalog must boot even if the index is slow/down —
      # the startup backfill waits for readiness itself and degrades gracefully if OpenSearch never comes up.
      opensearch:
        condition: service_started
    restart: unless-stopped

  cart-service:
    build: ./cart-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # cart snapshots price/name from catalog when a new line is added — must be the in-network host,
      # not the localhost default (which would resolve to the cart container itself).
      CATALOG_SERVICE_URL: http://catalog-service:8090
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    environment:
      DB_HOST: postgres
      DB_NAME: inventorydb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    environment:
      DB_HOST: postgres
      DB_NAME: paymentdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-cod}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build: ./order-service
    environment:
      DB_HOST: postgres
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      INVENTORY_SERVICE_URL: http://inventory-service:8092
      PAYMENT_SERVICE_URL: http://payment-service:8093
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped

  # ---- Gated video calling (Phase 3) — the brain + the WebRTC signaling/relay ----
  # videocall-service mints short-lived call GRANTs (10-min exp, room-bound, separate VIDEOCALL_GRANT_SECRET),
  # records Tally eligibility in its own DB, and holds the silent 5h cooldown in Redis. Gateway-internal
  # (no host port) — reached only via the gateway's /api/videocall/** route.
  videocall-service:
    build: ./videocall-service
    environment:
      DB_HOST: postgres
      DB_NAME: videocalldb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Cooldown store (videocall:cd:{userId}, 5h TTL) — atomic SETNX-with-TTL closes the double-issue race.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Grant signing key — DISTINCT from JWT_SECRET. Shared only with signaling-service (the verifier).
      VIDEOCALL_GRANT_SECRET: ${VIDEOCALL_GRANT_SECRET:?missing - run ./scripts/gen-secrets.sh to create .env}
      # ICE handed to the browser. STUN default works on one LAN; set the TURN vars for real NAT traversal.
      VIDEOCALL_STUN_URL: ${VIDEOCALL_STUN_URL:-stun:stun.l.google.com:19302}
      VIDEOCALL_TURN_URL: ${VIDEOCALL_TURN_URL:-}
      VIDEOCALL_TURN_USER: ${VIDEOCALL_TURN_USER:-webrtc}
      TURN_SECRET: ${TURN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Node + Socket.IO mesh signaling. Admits a socket ONLY on a valid grant (verifies VIDEOCALL_GRANT_SECRET,
  # aud=videocall-grant, fail-closed), enforces room-binding + MAX 3 + a kill-timer at the grant's exp.
  # Gateway-internal (no host port) — the SPA reaches it same-origin via the gateway's /socket.io/** route.
  signaling-service:
    build: ./signaling-service
    environment:
      PORT: 3001
      VIDEOCALL_GRANT_SECRET: ${VIDEOCALL_GRANT_SECRET:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Socket.IO CORS. The browser loads the SPA same-origin through the gateway, so the gateway's TLS
      # edge is the origin; keep this aligned with the gateway's ALLOWED_ORIGIN.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${SIGNALING_LOG_LEVEL:-info}
      # Distributed tracing (Pillar 1): label spans + export OTLP to the same APM Server the Java
      # services use, so a call's socket handshake joins the journey trace. Untraced if apm-server down.
      OTEL_SERVICE_NAME: signaling-service
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://apm-server:8200/v1/traces}
    restart: unless-stopped

  # TURN/STUN relay. The ONE piece that needs host ports — TURN relays media from the public internet, so
  # the relay range + listening port must be reachable. The credential is injected at runtime (NOT baked
  # into the conf): --user=webrtc:${TURN_SECRET}. Local dev can run STUN-only; this is wired for prod.
  # NOTE: on Linux, give this `network_mode: host` (+ external-ip in the conf) so the 49152-65535 relay
  # range is reachable; the per-port mapping below is a macOS/Docker-Desktop convenience for local STUN.
  coturn:
    image: coturn/coturn:alpine
    command: ["--log-file=stdout", "--user=webrtc:${TURN_SECRET:?missing - run ./scripts/gen-secrets.sh to create .env}"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    ports:
      # HTTPS edge (TLS terminates here — Pillar 4). Container listens on 8443.
      - "${GATEWAY_PORT:-8443}:8443"
    environment:
      AUTH_HOST: auth-service
      CATALOG_HOST: catalog-service
      CART_HOST: cart-service
      INVENTORY_HOST: inventory-service
      PAYMENT_HOST: payment-service
      ORDER_HOST: order-service
      VIDEOCALL_HOST: videocall-service
      SIGNALING_HOST: signaling-service
      # Storefront catch-all target (B1). The frontend nginx container publishes no host port, so the
      # gateway reaching it in-network is the only way the SPA is served — same-origin with /api.
      FRONTEND_HOST: frontend
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      # The entrypoint generates the dev keystore from this at start, and Spring opens it with the same
      # value — fail closed (no default) so a missing secret stops boot rather than shipping 'changeit'.
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Pillar 5: trust X-Forwarded-For for rate-limit keying ONLY behind a trusted proxy. Default false
      # (gateway is the exposed edge). The journey load test sets this true to simulate distinct clients.
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - inventory-service
      - payment-service
      - order-service
      - videocall-service
      - signaling-service
      - frontend
    restart: unless-stopped

  # ---- Storefront SPA (B1) — the public React/Vite app, containerized ----
  # Static nginx serving the built bundle. Deliberately NO host port: the only way in is the gateway's
  # catch-all route (storefront, order:1), so the browser loads the SPA and calls /api from one origin
  # (https://localhost:8443/) — CORS never engages. For fast local iteration, `npm run dev` on :5173
  # (with its Vite proxy) still works; this service is the go-live artifact.
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  # ---- Admin console (COD pilot) — network-isolated, NOT exposed to the public internet ----
  # Three layers keep it dark: (1) bound to 127.0.0.1 only, so it's reachable only via SSH tunnel / VPN;
  # (2) nginx HTTP basic-auth (creds from .env, generated at container start); (3) it proxies to
  # order-service's /admin/orders/** — a path the gateway does not route and order-service does not
  # publish — injecting X-User-Role: ADMIN, which order-service's AdminRoleFilter also enforces.
  admin-app:
    build:
      context: ./admin-app
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
    ports:
      # Loopback only — never 0.0.0.0. Access via: ssh -L 5174:127.0.0.1:5174 <host>, then localhost:5174.
      - "127.0.0.1:${ADMIN_APP_PORT:-5174}:80"
    depends_on:
      - order-service
    restart: unless-stopped

  # ---- Observability (Phase 2, Pillar 2) ----
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---- Observability Pillar 1 (distributed tracing): Elastic APM via OTLP ----
  # Single-node Elasticsearch stores the trace spans (and, in Phase 2, the shipped logs). Security is
  # OFF and the heap capped at 512m to stay light on the asset-light pilot box — a real deploy turns
  # xpack.security on with TLS + creds (see docs/observability-strategy.md). Postgres/OpenSearch remain
  # the source of truth; this is a debugging/forensics store. NOTE: ES + Kibana are RAM-hungry; this is
  # the documented cost of the ELK split. The Java services export OTLP to apm-server with NO depends_on
  # (the exporter degrades gracefully if the backend is down — services must boot regardless).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # Kibana renders the APM trace waterfall (and, in Phase 2, Discover over the shipped logs). Security
  # off to match Elasticsearch. Host-published on 5601 so the on-call can open a journey by trace.id.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # APM Server is the OTLP/HTTP intake on :8200 (the services post spans to /v1/traces) and writes them
  # to Elasticsearch. Anonymous auth is enabled (no secret token) for the local pilot — a real deploy
  # sets apm-server.auth.secret_token and injects it into each service's OTLP_TRACING_HEADERS.
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.3
    command:
      - apm-server
      - -e
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - apm-server.auth.anonymous.enabled=true
      - -E
      - apm-server.rum.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  opensearchdata:
  promdata:
  grafanadata:
  esdata:
