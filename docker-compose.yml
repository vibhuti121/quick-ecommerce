# Full local stack for quick-ecommerce — one `docker compose up` brings up the edge (gateway + auth),
# all five commerce services, and their backing stores. Each service owns its own Postgres database;
# cart lives in Redis. Data persists in named volumes, so the whole journey survives a restart.
#
# Edge entrypoint: https://localhost:8443 (gateway, TLS-terminated — Pillar 4). It uses a dev
# self-signed cert, so clients need -k/--insecure. Everything else is reachable through it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for product images (Phase 2, Pillar 4). Two ports:
  #  - 9000 the S3 API (catalog-service uploads here, in-network as http://minio:9000)
  #  - 9001 the web console (http://localhost:9001, same root creds)
  # No healthcheck binary ships in the server image, so dependents use service_started and
  # catalog-service retries bucket bootstrap on startup.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?missing - run ./scripts/gen-secrets.sh to create .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: postgres
      DB_NAME: authdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      # HS256 requires a key >= 256 bits (32 bytes); a shorter secret makes jjwt throw WeakKeyException.
      # No default on purpose: a signing key in source = anyone can forge tokens. Generated into .env.
      JWT_SECRET: ${JWT_SECRET:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Google OAuth2 is optional for local dev (guest tokens cover the journey). Real values enable
      # Google login; dummies let the service boot — the discovery URL itself is public.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # RBAC admin allowlist (Phase 3, Pillar 1). Comma-separated emails; empty → no admins.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build: ./catalog-service
    environment:
      DB_HOST: postgres
      DB_NAME: catalogdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      # Read-through cache for the catalog browse/detail path. A Redis outage degrades to DB reads.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Object storage for product images. ENDPOINT is the in-network S3 API the service uploads to;
      # PUBLIC_URL is what the browser uses to fetch the image, so it must be the host-published address.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?missing - run ./scripts/gen-secrets.sh to create .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  cart-service:
    build: ./cart-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # cart snapshots price/name from catalog when a new line is added — must be the in-network host,
      # not the localhost default (which would resolve to the cart container itself).
      CATALOG_SERVICE_URL: http://catalog-service:8090
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    environment:
      DB_HOST: postgres
      DB_NAME: inventorydb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    environment:
      DB_HOST: postgres
      DB_NAME: paymentdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build: ./order-service
    environment:
      DB_HOST: postgres
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      INVENTORY_SERVICE_URL: http://inventory-service:8092
      PAYMENT_SERVICE_URL: http://payment-service:8093
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      # Build-time keystore password for the dev self-signed TLS cert (Pillar 4). Kept in sync with
      # the runtime env below so Spring can open the keystore. Override via TLS_KEYSTORE_PASSWORD in .env.
      args:
        TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-changeit}
    ports:
      # HTTPS edge (TLS terminates here — Pillar 4). Container listens on 8443.
      - "${GATEWAY_PORT:-8443}:8443"
    environment:
      AUTH_HOST: auth-service
      CATALOG_HOST: catalog-service
      CART_HOST: cart-service
      INVENTORY_HOST: inventory-service
      PAYMENT_HOST: payment-service
      ORDER_HOST: order-service
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-changeit}
      # Pillar 5: trust X-Forwarded-For for rate-limit keying ONLY behind a trusted proxy. Default false
      # (gateway is the exposed edge). The journey load test sets this true to simulate distinct clients.
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - inventory-service
      - payment-service
      - order-service
    restart: unless-stopped

  # ---- Observability (Phase 2, Pillar 2) ----
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?missing - run ./scripts/gen-secrets.sh to create .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
