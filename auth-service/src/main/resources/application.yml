server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:authdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            # OAuth callback returns through the public edge, which is HTTPS at the gateway (Pillar 4).
            redirect-uri: ${OAUTH_REDIRECT_URI:https://localhost:8443/login/oauth2/code/google}
        provider:
          google:
            issuer-uri: https://accounts.google.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Real percentile histograms so Prometheus computes true p50/p95/p99 for API latency (Pillar 3).
      # SLO buckets straddle the checkout p99 < 800ms target; exemplars (trace_id stamped on a sample)
      # are auto-attached by the Micrometer tracing bridge --> click a Grafana spike straight to its trace.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,800ms,1s,2s
  tracing:
    sampling:
      # Head sampling ratio. Dev/pilot defaults to 1.0 (every journey captured for the trace
      # demo); set TRACING_SAMPLE_PROBABILITY lower in prod. Always-sample on error/payment/order
      # is a sampler refinement (deferred) layered on top of this ratio.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      # Elastic APM Server OTLP/HTTP intake on the compose network; Kibana APM renders the waterfall.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://apm-server:8200/v1/traces}

app:
  jwt:
    # No default: a signing key checked into source lets anyone forge tokens (full auth bypass).
    # JWT_SECRET MUST be supplied via env (.env in dev — run ./scripts/gen-secrets.sh); a missing
    # value fails startup, and a value < 32 bytes makes jjwt throw WeakKeyException. Fail-closed.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 hours
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Comma-separated email allowlist promoted to the ADMIN role at login (Phase 3, Pillar 1).
  # Empty by default → no admins, so the platform is locked-down out of the box.
  admin-emails: ${ADMIN_EMAILS:}
  otp:
    # 6-digit numeric code, valid 5 minutes, max 5 verify attempts before the code is burned.
    code-length: 6
    ttl-seconds: 300
    max-attempts: 5
    # Resend throttle: at most one request per phone in this window (cost control + anti-SMS-bombing).
    resend-window-seconds: 60
    # DEV STUB ONLY. When true, /auth/otp/request echoes the code in the JSON so local/CI can verify
    # without a real SMS. MUST stay false in any real deployment (it would leak every OTP). The real
    # SmsSender is wired in at go-live; until then LoggingSmsSender just logs the code.
    dev-echo: ${OTP_DEV_ECHO:false}
