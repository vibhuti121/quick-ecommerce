server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:authdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            # OAuth callback returns through the public edge, which is HTTPS at the gateway (Pillar 4).
            redirect-uri: ${OAUTH_REDIRECT_URI:https://localhost:8443/login/oauth2/code/google}
        provider:
          google:
            issuer-uri: https://accounts.google.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    # No default: a signing key checked into source lets anyone forge tokens (full auth bypass).
    # JWT_SECRET MUST be supplied via env (.env in dev — run ./scripts/gen-secrets.sh); a missing
    # value fails startup, and a value < 32 bytes makes jjwt throw WeakKeyException. Fail-closed.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 hours
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Comma-separated email allowlist promoted to the ADMIN role at login (Phase 3, Pillar 1).
  # Empty by default → no admins, so the platform is locked-down out of the box.
  admin-emails: ${ADMIN_EMAILS:}
