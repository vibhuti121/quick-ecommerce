# coturn TURN/STUN server for QuickCart video calls (vendored from the FamilyCall stack, de-branded).
#
# The long-term credential (the TURN user) is NOT baked into this committed file — it is injected at
# runtime via a `--user=webrtc:${TURN_SECRET}` CLI arg in docker-compose.yml (sourced from .env), so no
# secret lives here. lt-cred-mech below enables that username/password auth.
#
# Scope note (beta): this is wired for production NAT traversal but local verification runs STUN-only
# (two browsers on one LAN connect via STUN; TURN only matters across real NATs). On Linux prod, run
# this with host networking so the relay port range (min/max-port) is reachable; Docker Desktop on
# macOS can't host-network, so the compose service maps only the control port 3478 for a clean boot.

listening-port=3478
fingerprint
lt-cred-mech
realm=quickcart

# Relay port range. In prod (Linux + host networking) these are the UDP ports coturn hands out for
# media relay. external-ip must also be set at deploy time to the host's public IP, e.g.:
#   external-ip=<PUBLIC_IP>/<PRIVATE_IP>
min-port=49152
max-port=65535

# Plain UDP/TCP relay. TLS/DTLS are not terminated here — the app's HTTPS edge is the gateway; TURN
# over TLS (turns:) is a prod hardening step, deferred for the beta.
no-tls
no-dtls

# No telnet CLI (attack surface); log to stdout so `docker compose logs coturn` shows activity.
no-cli
log-file=stdout
simple-log
