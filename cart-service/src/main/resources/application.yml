server:
  port: 8091
  shutdown: graceful

spring:
  application:
    name: cart-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  threads:
    virtual:
      enabled: true

app:
  catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8090}
  # carts expire after this many days of inactivity
  cart-ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
