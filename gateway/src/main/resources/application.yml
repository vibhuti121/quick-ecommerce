server:
  # TLS terminates here at the edge (Phase 3, Pillar 4). The container always listens on 8443;
  # the host port is mapped in docker-compose. Inter-service traffic stays plain HTTP on the
  # docker network (see route URIs below) — only the public edge is encrypted.
  port: 8443
  ssl:
    enabled: true
    key-store: file:/app/keystore.p12
    key-store-type: PKCS12
    # No default: must match the password the entrypoint used to generate the keystore (from .env).
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-alias: gateway

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-oauth2
          uri: http://${AUTH_HOST:localhost}:8081
          predicates:
            - Path=/oauth2/**,/login/**

        - id: auth-service
          uri: http://${AUTH_HOST:localhost}:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # /api/auth/** also lands on auth-service. Today this carries Google Sign-In
        # (POST /api/auth/google, public — see AuthFilter PUBLIC_PATHS); kept as a sibling of /auth/**
        # so the storefront's `/api/`-prefixed auth call reaches auth-service rather than the SPA
        # catch-all. Same CircuitBreaker/Retry posture as the /auth/** route above.
        - id: auth-service-api
          uri: http://${AUTH_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                # Own breaker instance (NOT the shared "auth-service"): /api/auth/google deliberately
                # returns a clean 503 {disabled:true} when Google Sign-In isn't configured. That is a
                # valid application response, not an outage — it must NOT count toward, or trip, the
                # login breaker on the /auth/** route.
                name: auth-service-api
                fallbackUri: forward:/fallback/unavailable
                # SERVICE_UNAVAILABLE intentionally OMITTED: the disabled-google path returns 503 by
                # contract, so treating 503 as an upstream failure would mask the {disabled:true} body
                # with the generic fallback. Real upstream failure still surfaces as a connect/timeout
                # exception (which the breaker counts) or BAD_GATEWAY/GATEWAY_TIMEOUT below.
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: catalog-service
          uri: http://${CATALOG_HOST:localhost}:8090
          predicates:
            - Path=/api/catalog/**
          filters:
            - name: CircuitBreaker
              args:
                name: catalog-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: cart-service
          uri: http://${CART_HOST:localhost}:8091
          predicates:
            - Path=/api/cart/**
          filters:
            - name: CircuitBreaker
              args:
                name: cart-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: inventory-service
          uri: http://${INVENTORY_HOST:localhost}:8092
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventory-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: payment-service
          uri: http://${PAYMENT_HOST:localhost}:8093
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: order-service
          uri: http://${ORDER_HOST:localhost}:8094
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: order-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            # Only idempotent GETs are auto-retried at the edge. Checkout is a POST and carries an
            # Idempotency-Key, so the client (not the gateway) owns its retries — no double orders.
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: videocall-service
          uri: http://${VIDEOCALL_HOST:localhost}:8095
          predicates:
            - Path=/api/videocall/**
          filters:
            - name: CircuitBreaker
              args:
                name: videocall-service
                fallbackUri: forward:/fallback/unavailable
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # WebRTC signaling (Socket.IO). SCG proxies the WebSocket upgrade over a plain http:// uri — the
        # ws:// scheme is negotiated by the Upgrade handshake, not the route URI. NO CircuitBreaker/Retry:
        # those wrap request/response semantics and would break a long-lived bidirectional socket. The
        # upgrade is allowed through AuthFilter via /socket.io/ in PUBLIC_PATHS; signaling-service validates
        # the call grant carried in the handshake auth payload. Gateway-internal service, no host port.
        - id: signaling-service
          uri: http://${SIGNALING_HOST:localhost}:3001
          predicates:
            - Path=/socket.io/**

        # Storefront SPA (B1) — the catch-all. Path=/** matches EVERYTHING, including /api/**, so it
        # MUST be lowest priority: order:1 puts it behind every route above (implicit order:0), which
        # means the specific /api,/auth,/oauth2,/login routes win and this only serves what's left over
        # (the SPA shell + its static assets). Gateway actuator endpoints have higher handler-mapping
        # precedence than routes, so /actuator/health is unaffected. Served from the frontend nginx
        # container in-network; no host port — the gateway is its only ingress (same-origin with /api).
        - id: storefront
          uri: http://${FRONTEND_HOST:localhost}:80
          order: 1
          predicates:
            - Path=/**
          filters:
            # Static GETs only; a short retry rides out a cold-start blip. No CircuitBreaker (would need
            # a new resilience4j instance) — serving files is cheap and has no downstream to protect.
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGIN:http://localhost:5173}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            # Auth is a Bearer token in the Authorization header (localStorage), NOT cookies, so the
            # browser never makes credentialed cross-origin calls. Pillar 5: keep credentials OFF and
            # pin the request headers to exactly what the storefront sends — a wildcard with
            # credentials is spec-fragile and broadens the cross-origin attack surface needlessly.
            allowedHeaders: Authorization,Content-Type,Idempotency-Key
            allowCredentials: false
            # Cache the preflight so the browser doesn't re-OPTIONS every cross-origin call.
            maxAge: 3600

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      auth-service:
        baseConfig: default
      auth-service-api:
        baseConfig: default
      catalog-service:
        baseConfig: default
      cart-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
      payment-service:
        baseConfig: default
      order-service:
        baseConfig: default
      videocall-service:
        baseConfig: default
      auth-validate:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      auth-service:
        baseConfig: default
      auth-service-api:
        baseConfig: default
      catalog-service:
        baseConfig: default
      cart-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
      payment-service:
        baseConfig: default
      order-service:
        baseConfig: default
      videocall-service:
        baseConfig: default
      auth-validate:
        timeoutDuration: 2s
  bulkhead:
    instances:
      auth-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms
      catalog-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms
      cart-service:
        maxConcurrentCalls: 30
        maxWaitDuration: 500ms
      inventory-service:
        maxConcurrentCalls: 30
        maxWaitDuration: 500ms
      payment-service:
        maxConcurrentCalls: 30
        maxWaitDuration: 500ms
      order-service:
        maxConcurrentCalls: 30
        maxWaitDuration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Real percentile histograms so Prometheus computes true p50/p95/p99 for API latency (Pillar 3).
      # SLO buckets straddle the checkout p99 < 800ms target; exemplars (trace_id stamped on a sample)
      # are auto-attached by the Micrometer tracing bridge --> click a Grafana spike straight to its trace.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,800ms,1s,2s
  tracing:
    sampling:
      # Head sampling ratio. Dev/pilot defaults to 1.0 (every journey captured for the trace
      # demo); set TRACING_SAMPLE_PROBABILITY lower in prod. Always-sample on error/payment/order
      # is a sampler refinement (deferred) layered on top of this ratio.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      # Elastic APM Server OTLP/HTTP intake on the compose network; Kibana APM renders the waterfall.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://apm-server:8200/v1/traces}

app:
  auth-service-url: http://${AUTH_HOST:localhost}:8081
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-duration-seconds: 60
    max-tracked-ips: 20000
    ip-expire-minutes: 10
    # Pillar 5: only trust the client-supplied X-Forwarded-For when behind a trusted reverse proxy/LB
    # that overwrites it. Default false because the gateway is the directly-exposed edge — otherwise an
    # attacker spoofs XFF per request to mint unlimited buckets and bypass the limit. See RateLimitFilter.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
