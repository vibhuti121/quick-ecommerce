# Storefront SPA server. Static only — NO /api proxy: this container sits behind the gateway,
# which routes /api,/auth itself and forwards every other path here (catch-all route, order:1).
# So the browser sees one origin and never makes a cross-origin call.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Conservative headers for a public app. No X-Robots noindex here (this one IS meant to be found).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames under /assets — safe to cache hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: serve the file if it exists, else fall back to index.html (future-proofs client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
