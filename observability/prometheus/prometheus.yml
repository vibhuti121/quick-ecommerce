# Prometheus scrape config for the quick-ecommerce stack. Runs inside the compose network, so it
# reaches each service by its container name + internal port (gateway is the only one published to
# the host). Every service exposes Micrometer metrics at /actuator/prometheus (Phase 1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Recording/alerting rules (Pillar 3): SLO burn-rate, error-rate, service-down, payment-failure.
rule_files:
  - /etc/prometheus/rules/*.yml

# Route firing alerts to Alertmanager (in-network, plain HTTP on the compose bridge).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
        labels: { service: auth-service }
      - targets: ['catalog-service:8090']
        labels: { service: catalog-service }
      - targets: ['cart-service:8091']
        labels: { service: cart-service }
      - targets: ['inventory-service:8092']
        labels: { service: inventory-service }
      - targets: ['payment-service:8093']
        labels: { service: payment-service }
      - targets: ['order-service:8094']
        labels: { service: order-service }
      - targets: ['videocall-service:8095']
        labels: { service: videocall-service }

  # The gateway terminates TLS (Pillar 4), so it's scraped over HTTPS on 8443. The cert is a dev
  # self-signed one, so verification is skipped (in-network scrape, not a trust boundary here).
  - job_name: gateway
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['gateway:8443']
        labels: { service: gateway }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { service: prometheus }
