# Load every dashboard JSON dropped into /var/lib/grafana/dashboards at startup.
apiVersion: 1

providers:
  - name: quick-ecommerce
    orgId: 1
    folder: quick-ecommerce
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
