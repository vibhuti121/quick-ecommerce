server:
  port: 8093
  shutdown: graceful

spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  threads:
    virtual:
      enabled: true

# Which PaymentProvider bean is active. "mock" is the only impl today; Razorpay/Stripe
# can register under their own name and be selected via this property — no code change here.
app:
  payment:
    provider: ${PAYMENT_PROVIDER:mock}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Real percentile histograms so Prometheus computes true p50/p95/p99 for API latency (Pillar 3).
      # SLO buckets straddle the checkout p99 < 800ms target; exemplars (trace_id stamped on a sample)
      # are auto-attached by the Micrometer tracing bridge --> click a Grafana spike straight to its trace.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,800ms,1s,2s
  tracing:
    sampling:
      # Head sampling ratio. Dev/pilot defaults to 1.0 (every journey captured for the trace
      # demo); set TRACING_SAMPLE_PROBABILITY lower in prod. Always-sample on error/payment/order
      # is a sampler refinement (deferred) layered on top of this ratio.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      # Elastic APM Server OTLP/HTTP intake on the compose network; Kibana APM renders the waterfall.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://apm-server:8200/v1/traces}
